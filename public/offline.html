<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — Aniverse PRO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a1a2e 0%, #0b0b14 60%);
    color: #e8e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 40px 32px;
    backdrop-filter: blur(8px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .icon {
    width: 72px; height: 72px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff3d6e, #22d3ee);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(255,61,110,0.35);
  }
  .icon svg { width: 36px; height: 36px; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ff3d6e, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #a9a9bd;
    margin-bottom: 28px;
  }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    padding: 13px 28px;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff3d6e, #ff5e8a);
    box-shadow: 0 6px 18px rgba(255,61,110,0.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(255,61,110,0.5); }
  button:active { transform: translateY(0); }
  .hint { margin-top: 18px; font-size: 12.5px; color: #6b6b80; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Kamu sedang offline</h1>
    <p>Sepertinya koneksi internet terputus. Periksa koneksi lalu muat ulang halaman untuk melanjutkan menonton di Aniverse PRO.</p>
    <button type="button" onclick="window.location.reload()">Muat Ulang</button>
    <div class="hint">Aniverse PRO membutuhkan koneksi untuk memutar video.</div>
  </div>
</body>
</html>
